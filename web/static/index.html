<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Live Call Simulator — Unified Scam Intelligence Platform</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; }
  #chunks { white-space: pre-wrap; border: 1px solid #ccc; padding: 1rem; min-height: 100px; }
  .alert { color: white; background: #c0392b; padding: 0.5rem; margin-top: 1rem; }
  .ok { color: white; background: #27ae60; padding: 0.5rem; margin-top: 1rem; }
  textarea { width: 100%; height: 60px; }
</style>
</head>
<body>
<h1>Live Call Simulator (demo only — no real telephony)</h1>
<p>Backend must be running: <code>uvicorn uspi.api.app:app --reload --port 8000</code></p>
<button id="startBtn">Start call</button>
<p>Case id: <span id="caseId">(not started)</span></p>
<textarea id="chunkText" placeholder="Type a transcript chunk (e.g. a caller line) and click Send"></textarea>
<button id="sendBtn">Send chunk</button>
<button id="endBtn">End call</button>
<div id="chunks"></div>
<div id="status"></div>

<script>
const API_BASE = "http://localhost:8000";
let caseId = null;
let startS = 0;

document.getElementById("startBtn").onclick = async () => {
  const resp = await fetch(`${API_BASE}/v1/live/start`, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({})
  });
  const data = await resp.json();
  caseId = data.case_id;
  document.getElementById("caseId").innerText = caseId;
};

document.getElementById("sendBtn").onclick = async () => {
  if (!caseId) { alert("Start a call first"); return; }
  const text = document.getElementById("chunkText").value;
  const endS = startS + 12;
  const resp = await fetch(`${API_BASE}/v1/live/chunk`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ case_id: caseId, transcript_text: text, start_s: startS, end_s: endS })
  });
  const data = await resp.json();
  startS = endS;
  const chunksDiv = document.getElementById("chunks");
  chunksDiv.innerText += `[seg ${data.segment_id} | ${data.start_s ?? ""}-${endS}s] "${text}" (refinement: ${data.refinement_status})\n -> policy_score=${data.policy_score.toFixed(1)} alert=${data.alert_active} critical=${data.critical} scam_type=${data.scam_type_guess}\n\n`;
  const statusDiv = document.getElementById("status");
  statusDiv.className = data.alert_active ? "alert" : "ok";
  statusDiv.innerText = data.alert_active
    ? "RISK INDICATORS: review this call, do not share OTPs/passwords/money."
    : "No alert raised. This is not a guarantee of safety.";
};

document.getElementById("endBtn").onclick = async () => {
  if (!caseId) return;
  const resp = await fetch(`${API_BASE}/v1/live/end?case_id=${encodeURIComponent(caseId)}`, { method: "POST" });
  const data = await resp.json();
  document.getElementById("status").innerText = `Call ended: ${data.outcome} (${data.reason})`;
};
</script>
</body>
</html>
